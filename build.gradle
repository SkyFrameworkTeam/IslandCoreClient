plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	mods {
		"islandcoreclient" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// Release task — ONLY runs what's below when invoked explicitly via `./gradlew release`.
// Normal `./gradlew build` is completely untouched by this: it doesn't depend on this task, and
// this task doesn't hook into it.
//
// Why this shells out to a fresh `gradlew build` instead of `dependsOn 'build'`: project.version
// is fixed at configuration time, before any task runs — so even after this task's doLast
// rewrites mod_version in gradle.properties on disk, the CURRENT Gradle invocation would still
// embed the OLD version in the jar/fabric.mod.json if it just depended on the existing `build`
// task. Re-invoking gradlew as a brand new process forces a fresh read of the file we just wrote,
// so the release jar's embedded version actually matches the bumped mod_version.
tasks.register('release') {
	group = 'release'
	description = 'Bumps mod_version (patch, dropping any -SNAPSHOT/-dev suffix), builds a release jar, ' +
			'commits gradle.properties, and creates an annotated git tag. Never pushes automatically.'

	doLast {
		def propsFile = file('gradle.properties')
		def oldVersion = project.mod_version
		def bareVersion = oldVersion.replaceAll(/-(SNAPSHOT|dev)$/, '')
		def parts = bareVersion.tokenize('.')
		if (parts.size() != 3) {
			throw new GradleException("mod_version '${oldVersion}' isn't in x.y.z form, can't bump it automatically.")
		}
		def newVersion = "${parts[0]}.${parts[1]}.${(parts[2] as int) + 1}"

		propsFile.text = propsFile.readLines().collect { line ->
			line.startsWith('mod_version=') ? "mod_version=${newVersion}" : line
		}.join('\n') + '\n'
		logger.lifecycle("mod_version: ${oldVersion} -> ${newVersion}")

		// Plain ProcessBuilder, not Gradle's exec {}/project.exec {} — both are deprecated/removed
		// in current Gradle for configuration-cache reasons (the "proper" replacement is injecting
		// ExecOperations into a real task class, which is overkill for this simple sequential
		// script). ProcessBuilder has no such churn risk across Gradle versions.
		def runCommand = { List<String> cmd ->
			// .toString() each element: Groovy GString interpolations (e.g. "Release v${x}")
			// aren't java.lang.String, and ProcessBuilder's internal toArray(String[]) cast
			// blows up on them with an ArrayStoreException-style arraycopy error.
			def process = new ProcessBuilder(cmd.collect { it.toString() })
					.directory(projectDir)
					.redirectErrorStream(true)
					.start()
			process.inputStream.eachLine { logger.lifecycle(it) }
			int exitCode = process.waitFor()
			if (exitCode != 0) {
				throw new GradleException("Command failed (exit ${exitCode}): ${cmd.join(' ')}")
			}
		}

		// Absolute path to the wrapper script, not a bare "gradlew.bat"/"./gradlew" name: this
		// environment has NoDefaultCurrentDirectoryInExePath set, which makes cmd unable to find
		// an unqualified gradlew.bat even when directory(projectDir) is that very folder. An
		// absolute path sidesteps that lookup entirely.
		def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
		def wrapperPath = new File(projectDir, isWindows ? 'gradlew.bat' : 'gradlew').absolutePath
		runCommand(isWindows ? ['cmd', '/c', wrapperPath, 'build'] : [wrapperPath, 'build'])
		runCommand(['git', 'add', 'gradle.properties'])
		runCommand(['git', 'commit', '-m', "Release v${newVersion}"])
		runCommand(['git', 'tag', '-a', "v${newVersion}", '-m', "Release v${newVersion}"])

		logger.lifecycle("Release v${newVersion} committed and tagged LOCALLY. Nothing has been pushed.")
		logger.lifecycle("When you're ready: git push origin main --tags")
	}
}

// syncVersion — keeps this client's mod_version in lockstep with the server project's (the two
// mods are meant to ship together, and the server is treated as the source of truth here). Runs
// automatically as part of every `./gradlew build` (see the tasks.named('build') block below);
// reads the server's gradle.properties LITERALLY — no assumed format/suffix, just whatever string
// is there — and rewrites this project's gradle.properties only if the value actually differs.
//
// Like every doLast that rewrites gradle.properties, this can't retroactively change THIS
// invocation's own project.version: version = project.mod_version at the top of this file already
// ran during Gradle's configuration phase, before any task (including this one) executes — same
// reason the release task above has to shell out to a brand new gradlew process instead of just
// depending on 'build'. So the jar/fabric.mod.json from the CURRENT `./gradlew build` still embed
// whichever mod_version was on disk BEFORE this task ran; gradle.properties itself is corrected
// either way, so the very next build already reads (and embeds) the synced value.
tasks.register('syncVersion') {
	group = 'versioning'
	description = "Copies mod_version from the server project's gradle.properties into this one, if they differ."

	doLast {
		def serverPropsFile = file('../skyframework-template-1.21.1/gradle.properties')
		if (!serverPropsFile.exists()) {
			logger.warn("syncVersion: server gradle.properties not found at ${serverPropsFile} — skipping.")
			return
		}

		def serverProps = new Properties()
		serverPropsFile.withInputStream { serverProps.load(it) }
		def serverVersion = serverProps.getProperty('mod_version')
		if (serverVersion == null) {
			logger.warn("syncVersion: server gradle.properties has no mod_version — skipping.")
			return
		}

		if (serverVersion == project.mod_version) {
			logger.lifecycle("syncVersion: mod_version already matches the server (${serverVersion}).")
			return
		}

		def oldVersion = project.mod_version
		def propsFile = file('gradle.properties')
		propsFile.text = propsFile.readLines().collect { line ->
			line.startsWith('mod_version=') ? "mod_version=${serverVersion}" : line
		}.join('\n') + '\n'
		logger.lifecycle("syncVersion: mod_version ${oldVersion} -> ${serverVersion} (from server). Takes effect starting the next build.")
	}
}

tasks.named('build') {
	dependsOn 'syncVersion'
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
